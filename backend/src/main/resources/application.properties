spring.application.name=backend
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fake_product_detection}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.resolve-lazily=true

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

ml.service.base-url=http://127.0.0.1:8000
ml.service.connect-timeout=3s
ml.service.read-timeout=30s

reference-storage.local-directory=${REFERENCE_STORAGE_LOCAL_DIRECTORY:storage/reference-images}
reference-storage.max-file-size=${REFERENCE_STORAGE_MAX_FILE_SIZE:10485760}